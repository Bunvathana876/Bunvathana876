# Generate an animated koi from public GitHub contributions.
# Official example: https://github.com/yalongwastaken/git-koi
name: Koi

on:
  schedule:
    # Just after midnight UTC (07:20 in Cambodia).
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: Bunvathana876
          body: asagi
          output-dir: koi

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"

          # Another profile edit may have landed while we rendered the GIF.
          # Rebase our new commit onto the latest main and retry safely.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git rebase origin/main
            if git push --quiet origin HEAD:main; then
              echo "Koi GIF successfully committed to main."
              exit 0
            fi
            echo "Push attempt $attempt rejected; retrying..."
          done
          echo "Unable to push after three attempts." >&2
          exit 1
